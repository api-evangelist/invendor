openapi: 3.2.0
info:
  title: IO.Common Scales API
  version: '1.0'
security:
- OAuth2: []
tags:
- name: Scales
paths:
  /v1/Scales/shelves:
    get:
      tags:
      - Scales
      operationId: Shelf layouts
      parameters:
      - name: Account
        in: query
        description: Account
        schema:
          title: Account
          type: int
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShelfLayoutResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
      summary: Shelf layouts
      x-summary-source: derived
components:
  schemas:
    BinTypeResponse:
      type: object
      properties:
        code:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        length:
          type: integer
          format: int32
        width:
          type: integer
          format: int32
        height:
          type: integer
          format: int32
      additionalProperties: false
    ShelfLayoutResponse:
      type: object
      properties:
        id:
          type: integer
          format: int32
        code:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        minShelfHeight:
          type: integer
          format: int32
        bins:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ShelfLayoutBinResponse'
      additionalProperties: false
    ShelfLayoutBinResponse:
      type: object
      properties:
        id:
          type: integer
          format: int32
        index:
          type: integer
          format: int32
        binType:
          $ref: '#/components/schemas/BinTypeResponse'
      additionalProperties: false
    ProblemDetails:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
      additionalProperties: {}
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://identity.scanbro.com/connect/authorize
          tokenUrl: https://identity.scanbro.com/connect/token
          scopes:
            io.common: default scope
