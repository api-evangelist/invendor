openapi: 3.2.0
info:
  title: IO.Common User Profiles API
  version: '1.0'
security:
- OAuth2: []
tags:
- name: User Profiles
paths:
  /v1/UserProfiles:
    get:
      tags:
      - User Profiles
      summary: Returns all user groups
      operationId: GetUserGroups
      parameters:
      - name: Filter
        in: query
        schema:
          type: string
      - name: Page
        in: query
        schema:
          type: integer
          format: int32
      - name: PageSize
        in: query
        schema:
          type: integer
          format: int32
      - name: SortColumn
        in: query
        schema:
          type: string
      - name: SortOrder
        in: query
        schema:
          type: string
      - name: Account
        in: query
        description: Account
        schema:
          title: Account
          type: int
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponsePagedResult'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
    post:
      tags:
      - User Profiles
      summary: Create new user group
      operationId: CreateUserGroup
      parameters:
      - name: Account
        in: query
        description: Account
        schema:
          title: Account
          type: int
      requestBody:
        description: Create user profile request object. Description in docs
        content:
          application/json-patch+json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/CreateUserProfileRequest'
          application/json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/CreateUserProfileRequest'
          text/json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/CreateUserProfileRequest'
          application/*+json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/CreateUserProfileRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Int32ResourceCreatedResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: Client Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
  /v1/UserProfiles/{profileId}:
    get:
      tags:
      - User Profiles
      summary: Retruns selected user group details
      operationId: GetUserGroupDetails
      parameters:
      - name: profileId
        in: path
        description: ''
        required: true
        schema:
          type: integer
          format: int32
      - name: Account
        in: query
        description: Account
        schema:
          title: Account
          type: int
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileDetailsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
    put:
      tags:
      - User Profiles
      summary: Update selected user group details
      operationId: UpdateUserGroupDetails
      parameters:
      - name: profileId
        in: path
        description: ''
        required: true
        schema:
          type: integer
          format: int32
      - name: Account
        in: query
        description: Account
        schema:
          title: Account
          type: int
      requestBody:
        description: ''
        content:
          application/json-patch+json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/UpdateUserProfileDetailsRequest'
          application/json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/UpdateUserProfileDetailsRequest'
          text/json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/UpdateUserProfileDetailsRequest'
          application/*+json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/UpdateUserProfileDetailsRequest'
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: Client Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
    delete:
      tags:
      - User Profiles
      summary: Delete selected user group
      operationId: DeleteUserGroup
      parameters:
      - name: profileId
        in: path
        description: ''
        required: true
        schema:
          type: integer
          format: int32
      - name: Account
        in: query
        description: Account
        schema:
          title: Account
          type: int
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
  /v1/UserProfiles/properties:
    get:
      tags:
      - User Profiles
      summary: Get the list of all the properties added to user groups
      operationId: GetAllUsedUserProfileProperties
      parameters:
      - name: Account
        in: query
        description: Account
        schema:
          title: Account
          type: int
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
  /v1/UserProfiles/{profileId}/users:
    get:
      tags:
      - User Profiles
      summary: Returns users list assigned to selected user group
      operationId: GetUserGroupUsers
      parameters:
      - name: profileId
        in: path
        description: ''
        required: true
        schema:
          type: integer
          format: int32
      - name: Filter
        in: query
        schema:
          type: string
      - name: Page
        in: query
        schema:
          type: integer
          format: int32
      - name: PageSize
        in: query
        schema:
          type: integer
          format: int32
      - name: SortColumn
        in: query
        schema:
          type: string
      - name: SortOrder
        in: query
        schema:
          type: string
      - name: Account
        in: query
        description: Account
        schema:
          title: Account
          type: int
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponsePagedResult'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
    post:
      tags:
      - User Profiles
      summary: Add users to selected user group
      operationId: AddUserToUserGroup
      parameters:
      - name: profileId
        in: path
        description: ''
        required: true
        schema:
          type: integer
          format: int32
      - name: Account
        in: query
        description: Account
        schema:
          title: Account
          type: int
      requestBody:
        description: ''
        content:
          application/json-patch+json; x-api-version=1.0:
            schema:
              type: array
              items:
                type: integer
                format: int32
          application/json; x-api-version=1.0:
            schema:
              type: array
              items:
                type: integer
                format: int32
          text/json; x-api-version=1.0:
            schema:
              type: array
              items:
                type: integer
                format: int32
          application/*+json; x-api-version=1.0:
            schema:
              type: array
              items:
                type: integer
                format: int32
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
  /v1/UserProfiles/{profileId}/locations/available:
    get:
      tags:
      - User Profiles
      summary: Returns locations available to assign to a user group (not yet assigned)
      operationId: GetAvailableLocationsForUserGroup
      parameters:
      - name: profileId
        in: path
        description: ''
        required: true
        schema:
          type: integer
          format: int32
      - name: account
        in: query
        description: Account ID
        schema:
          type: integer
          format: int32
      - name: Filter
        in: query
        schema:
          type: string
      - name: Page
        in: query
        schema:
          type: integer
          format: int32
      - name: PageSize
        in: query
        schema:
          type: integer
          format: int32
      - name: SortColumn
        in: query
        schema:
          type: string
      - name: SortOrder
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResponsePagedResult'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
  /v1/UserProfiles/{profileId}/locations:
    get:
      tags:
      - User Profiles
      summary: Returns user group locations list
      operationId: GetUserGroupLocations
      parameters:
      - name: profileId
        in: path
        description: ''
        required: true
        schema:
          type: integer
          format: int32
      - name: Filter
        in: query
        schema:
          type: string
      - name: Page
        in: query
        schema:
          type: integer
          format: int32
      - name: PageSize
        in: query
        schema:
          type: integer
          format: int32
      - name: SortColumn
        in: query
        schema:
          type: string
      - name: SortOrder
        in: query
        schema:
          type: string
      - name: Account
        in: query
        description: Account
        schema:
          title: Account
          type: int
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileLocationResponsePagedResult'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
    post:
      tags:
      - User Profiles
      summary: Save user group locations and operations
      operationId: SaveUserGroupLocation
      parameters:
      - name: profileId
        in: path
        description: ''
        required: true
        schema:
          type: integer
          format: int32
      - name: Account
        in: query
        description: Account
        schema:
          title: Account
          type: int
      requestBody:
        description: ''
        content:
          application/json-patch+json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/CreateProfileLocationRequest'
          application/json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/CreateProfileLocationRequest'
          text/json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/CreateProfileLocationRequest'
          application/*+json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/CreateProfileLocationRequest'
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
  /v1/UserProfiles/{profileId}/locations/{locationId}:
    delete:
      tags:
      - User Profiles
      summary: Delete user group location
      operationId: DeleteUserGroupLocation
      parameters:
      - name: profileId
        in: path
        description: ''
        required: true
        schema:
          type: integer
          format: int32
      - name: locationId
        in: path
        description: ''
        required: true
        schema:
          type: integer
          format: int32
      - name: Account
        in: query
        description: Account
        schema:
          title: Account
          type: int
      responses:
        '204':
          description: No Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Int32ResourceCreatedResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
  /v1/UserProfiles/{profileId}/locations/{locationId}/operations:
    post:
      tags:
      - User Profiles
      summary: Add a single operation to user group location
      operationId: CreateUserGroupLocationOperation
      parameters:
      - name: profileId
        in: path
        description: ''
        required: true
        schema:
          type: integer
          format: int32
      - name: locationId
        in: path
        description: ''
        required: true
        schema:
          type: integer
          format: int32
      - name: Account
        in: query
        description: Account
        schema:
          title: Account
          type: int
      requestBody:
        description: ''
        content:
          application/json-patch+json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/LocationOperationRequest'
          application/json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/LocationOperationRequest'
          text/json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/LocationOperationRequest'
          application/*+json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/LocationOperationRequest'
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
  /v1/UserProfiles/{profileId}/locations/{locationId}/operations/{operationId}:
    delete:
      tags:
      - User Profiles
      summary: Delete selected operation from user group location
      operationId: DeleteUserGroupLocationOperation
      parameters:
      - name: profileId
        in: path
        description: ''
        required: true
        schema:
          type: integer
          format: int32
      - name: locationId
        in: path
        description: ''
        required: true
        schema:
          type: integer
          format: int32
      - name: operationId
        in: path
        description: ''
        required: true
        schema:
          type: integer
          format: int32
      - name: Account
        in: query
        description: Account
        schema:
          title: Account
          type: int
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
components:
  schemas:
    CreateProfileLocationRequest:
      type: object
      properties:
        locationId:
          type: integer
          format: int32
        operations:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/LocationOperationRequest'
      additionalProperties: false
    ProfileLocationOperationQuestionResponse:
      type: object
      properties:
        questionId:
          type:
          - string
          - 'null'
        questionText:
          type:
          - string
          - 'null'
        scope:
          $ref: '#/components/schemas/SessionScanEventEnum'
      additionalProperties: false
    UserProfileResponsePagedResult:
      type: object
      properties:
        pageSize:
          type: integer
          format: int32
          readOnly: true
        page:
          type: integer
          format: int32
          readOnly: true
        totalCount:
          type: integer
          format: int32
          readOnly: true
        filteredCount:
          type: integer
          format: int32
          readOnly: true
        data:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/UserProfileResponse'
          readOnly: true
      additionalProperties: false
    LocationConsumptionType:
      enum:
      - 10
      - 20
      type: integer
      format: int32
    LocationOperationRequest:
      type: object
      properties:
        operationId:
          type: integer
          format: int32
        autoFinish:
          type: boolean
        noDoorAccess:
          type: boolean
        locks:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/LocationOperationLock'
        questions:
          type:
          - array
          - 'null'
          items:
            type: string
      additionalProperties: false
    ProfileLocationResponse:
      type: object
      properties:
        locationId:
          type: integer
          format: int32
        userProfileId:
          type: integer
          format: int32
        name:
          type:
          - string
          - 'null'
        serviceType:
          type:
          - string
          - 'null'
        subscriptionId:
          type:
          - string
          - 'null'
          format: uuid
        operations:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ProfileLocationOperationResponse'
      additionalProperties: false
    Int32ResourceCreatedResponse:
      type: object
      properties:
        id:
          type: integer
          format: int32
      additionalProperties: false
    CreateUserProfileRequest:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
        properties:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
        doors:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Door'
      additionalProperties: false
    LocationResponsePagedResult:
      type: object
      properties:
        pageSize:
          type: integer
          format: int32
          readOnly: true
        page:
          type: integer
          format: int32
          readOnly: true
        totalCount:
          type: integer
          format: int32
          readOnly: true
        filteredCount:
          type: integer
          format: int32
          readOnly: true
        data:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/LocationResponse'
          readOnly: true
      additionalProperties: false
    UpdateUserProfileDetailsRequest:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
        mfaEnabled:
          type: boolean
        doors:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Door'
        properties:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
      additionalProperties: false
    LocationResponse:
      type: object
      properties:
        id:
          type: integer
          format: int32
        accountId:
          type:
          - integer
          - 'null'
          format: int32
        name:
          type:
          - string
          - 'null'
        shortName:
          type:
          - string
          - 'null'
        type:
          $ref: '#/components/schemas/LocationType'
        accountCode:
          type:
          - string
          - 'null'
        accountName:
          type:
          - string
          - 'null'
        properties:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
        consumptionType:
          $ref: '#/components/schemas/LocationConsumptionType'
      additionalProperties: false
    Door:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
      additionalProperties: false
    ProfileLocationOperationResponse:
      type: object
      properties:
        operationId:
          type: integer
          format: int32
        name:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        autoFinish:
          type:
          - boolean
          - 'null'
        noDoorAccess:
          type:
          - boolean
          - 'null'
        doors:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Door'
        questions:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ProfileLocationOperationQuestionResponse'
      additionalProperties: false
    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int32
        username:
          type:
          - string
          - 'null'
        accountId:
          type: integer
          format: int32
        profileId:
          type: integer
          format: int32
        firstName:
          type:
          - string
          - 'null'
        lastName:
          type:
          - string
          - 'null'
        fullName:
          type:
          - string
          - 'null'
          readOnly: true
        profileName:
          type:
          - string
          - 'null'
        identityId:
          type:
          - string
          - 'null'
        nfcid:
          type:
          - string
          - 'null'
        pin:
          type:
          - string
          - 'null'
        simpleUser:
          type: boolean
        isDashboardEnabled:
          type: boolean
        email:
          type:
          - string
          - 'null'
        emailConfirmed:
          type: boolean
        mfaEnabled:
          type: boolean
      additionalProperties: false
    LocationOperationLock:
      type: object
      properties:
        lockId:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
      additionalProperties: false
    UserProfileResponse:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type:
          - string
          - 'null'
        accountId:
          type:
          - integer
          - 'null'
          format: int32
        accountName:
          type:
          - string
          - 'null'
        mfaEnabled:
          type: boolean
      additionalProperties: false
    Error:
      type: object
      properties:
        code:
          type:
          - string
          - 'null'
        message:
          type:
          - string
          - 'null'
      additionalProperties: false
    ApiErrorResponse:
      type: object
      properties:
        errors:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Error'
      additionalProperties: false
    SessionScanEventEnum:
      enum:
      - 0
      - 1
      type: integer
      format: int32
    UserProfileDetailsResponse:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type:
          - string
          - 'null'
        accountId:
          type:
          - integer
          - 'null'
          format: int32
        accountName:
          type:
          - string
          - 'null'
        mfaEnabled:
          type: boolean
        properties:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
        doors:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Door'
      additionalProperties: false
    ProfileLocationResponsePagedResult:
      type: object
      properties:
        pageSize:
          type: integer
          format: int32
          readOnly: true
        page:
          type: integer
          format: int32
          readOnly: true
        totalCount:
          type: integer
          format: int32
