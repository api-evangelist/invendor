openapi: 3.2.0
info:
  title: IO.Reports Metadata API
  version: '1.0'
tags:
- name: Metadata
paths:
  /api/v1/Metadata/Dimensions:
    get:
      tags:
      - Metadata
      summary: Get all the values for metadata dimensions
      parameters:
      - name: accountId
        in: query
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MetadataDimensionDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.reporting
      operationId: getApiV1MetadataDimensions
      x-operation-id-source: derived
components:
  schemas:
    Error:
      type: object
      properties:
        code:
          type:
          - string
          - 'null'
        message:
          type:
          - string
          - 'null'
      additionalProperties: false
    DimensionType:
      enum:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      - 8
      - 100
      - 198
      - 199
      - 200
      type: integer
      format: int32
    MetadataDimensionDTO:
      type: object
      properties:
        id:
          type: integer
          format: int32
        shortName:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
        dimensionType:
          $ref: '#/components/schemas/DimensionType'
      additionalProperties: false
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://identity.scanbro.com/connect/authorize
          tokenUrl: https://identity.scanbro.com/connect/token
          scopes:
            io.reporting: default scope
