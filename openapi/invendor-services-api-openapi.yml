openapi: 3.2.0
info:
  title: IO.Common Services API
  version: '1.0'
security:
- OAuth2: []
tags:
- name: Services
paths:
  /v1/Services:
    get:
      tags:
      - Services
      summary: Services the current tenant currently subscribes to.
      operationId: Services list
      parameters:
      - name: Account
        in: query
        description: Account
        schema:
          title: Account
          type: int
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Service'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
  /v1/Services/available:
    get:
      tags:
      - Services
      summary: Full system catalog of services.
      operationId: Available services list
      parameters:
      - name: Account
        in: query
        description: Account
        schema:
          title: Account
          type: int
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Service'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
components:
  schemas:
    IDomainEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        occurredOn:
          type: string
          format: date-time
          readOnly: true
      additionalProperties: false
    Service:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
        subscriptions:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Subscription'
      additionalProperties: false
    Subscription:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        domainEvents:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/IDomainEvent'
          readOnly: true
        createdOn:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
        modifiedOn:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
        tenantId:
          type: string
          format: uuid
        serviceId:
          type: string
          format: uuid
        startDate:
          type:
          - string
          - 'null'
          format: date-time
        endDate:
          type:
          - string
          - 'null'
          format: date-time
        ended:
          type: boolean
        service:
          $ref: '#/components/schemas/Service'
      additionalProperties: false
    ProblemDetails:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
      additionalProperties: {}
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://identity.scanbro.com/connect/authorize
          tokenUrl: https://identity.scanbro.com/connect/token
          scopes:
            io.common: default scope
