openapi: 3.2.0
info:
  title: Invendor Auth API
  version: '1.0'
  description: 'Operations tagged Auth across 2 of this provider''s published API definitions: invendor-common-openapi-original.json, invendor-reporting-openapi-original.json. Each path carries the servers of the definition it was published in.'
tags:
- name: Auth
paths:
  /api/v1/Auth/login:
    post:
      tags:
      - Auth
      summary: Login endpoint for Swagger - exchanges credentials for OAuth token and sets…
      parameters:
      - name: Account
        in: query
        description: Account
        schema:
          title: Account
          type: int
      requestBody:
        content:
          application/json-patch+json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          text/json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/*+json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Success
        '401':
          description: Unauthorized
          content:
            text/plain; x-api-version=1.0:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json; x-api-version=1.0:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json; x-api-version=1.0:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - OAuth2: []
      operationId: postApiV1AuthLogin
      x-operation-id-source: derived
  /api/v1/Auth/logout:
    post:
      tags:
      - Auth
      summary: Logout endpoint - clears authentication cookie
      parameters:
      - name: Account
        in: query
        description: Account
        schema:
          title: Account
          type: int
      responses:
        '200':
          description: Success
      security:
      - OAuth2: []
      operationId: postApiV1AuthLogout
      x-operation-id-source: derived
  /api/v1/Auth/status:
    get:
      tags:
      - Auth
      summary: Check authentication status
      parameters:
      - name: Account
        in: query
        description: Account
        schema:
          title: Account
          type: int
      responses:
        '200':
          description: Success
      security:
      - OAuth2: []
      operationId: getApiV1AuthStatus
      x-operation-id-source: derived
components:
  schemas:
    LoginRequest:
      type: object
      properties:
        username:
          type:
          - string
          - 'null'
        password:
          type:
          - string
          - 'null'
      additionalProperties: false
    ProblemDetails:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
      additionalProperties: {}
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://identity.scanbro.com/connect/authorize
          tokenUrl: https://identity.scanbro.com/connect/token
          scopes:
            io.common: default scope
x-refined-from:
- invendor-common-openapi-original.json
- invendor-reporting-openapi-original.json
