openapi: 3.2.0
info:
  title: IO.Common Accounts API
  version: '1.0'
security:
- OAuth2: []
tags:
- name: Accounts
paths:
  /v1/Accounts/me:
    get:
      tags:
      - Accounts
      summary: Returns the detailed info of an account
      operationId: My account details
      parameters:
      - name: Account
        in: query
        description: Account
        schema:
          title: Account
          type: int
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDetailsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
  /v1/Accounts:
    get:
      tags:
      - Accounts
      operationId: Accounts list
      parameters:
      - name: Filter
        in: query
        schema:
          type: string
      - name: Page
        in: query
        schema:
          type: integer
          format: int32
      - name: PageSize
        in: query
        schema:
          type: integer
          format: int32
      - name: SortColumn
        in: query
        schema:
          type: string
      - name: SortOrder
        in: query
        schema:
          type: string
      - name: Account
        in: query
        description: Account
        schema:
          title: Account
          type: int
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponseIPagedResult'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
      summary: Accounts list
      x-summary-source: derived
    post:
      tags:
      - Accounts
      summary: Creates a new account.
      operationId: Create account
      parameters:
      - name: Account
        in: query
        description: Account
        schema:
          title: Account
          type: int
      requestBody:
        description: ''
        content:
          application/json-patch+json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
          application/json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
          text/json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
          application/*+json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Int32ResourceCreatedResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: Client Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
  /v1/Accounts/{accountId}:
    get:
      tags:
      - Accounts
      summary: Returns the detailed info of an account
      operationId: Account details
      parameters:
      - name: accountId
        in: path
        description: Account Id
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDetailsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
    put:
      tags:
      - Accounts
      operationId: Update account
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json-patch+json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/UpdateAccountRequest'
          application/json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/UpdateAccountRequest'
          text/json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/UpdateAccountRequest'
          application/*+json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/UpdateAccountRequest'
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
      summary: Update account
      x-summary-source: derived
    delete:
      tags:
      - Accounts
      summary: Deletes an account.
      operationId: Delete account
      parameters:
      - name: accountId
        in: path
        description: ''
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
  /v1/Accounts/fromInvitation:
    post:
      tags:
      - Accounts
      operationId: Create account from invitation
      parameters:
      - name: Account
        in: query
        description: Account
        schema:
          title: Account
          type: int
      requestBody:
        content:
          application/json-patch+json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/CreateAccountFromInvitationRequest'
          application/json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/CreateAccountFromInvitationRequest'
          text/json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/CreateAccountFromInvitationRequest'
          application/*+json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/CreateAccountFromInvitationRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Int32ResourceCreatedResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: Client Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
      summary: Create account from invitation
      x-summary-source: derived
  /v1/Accounts/{accountId}/fromInvitation:
    put:
      tags:
      - Accounts
      operationId: Create account linked settings from invitation
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json-patch+json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/UpdateAccountFromInvitationRequest'
          application/json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/UpdateAccountFromInvitationRequest'
          text/json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/UpdateAccountFromInvitationRequest'
          application/*+json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/UpdateAccountFromInvitationRequest'
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: Client Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
      summary: Create account linked settings from invitation
      x-summary-source: derived
  /v1/Accounts/{accountId}/linkedLocations:
    put:
      tags:
      - Accounts
      operationId: Update linked account locations mapping
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json-patch+json; x-api-version=1.0:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/LinkedLocationsMap'
          application/json; x-api-version=1.0:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/LinkedLocationsMap'
          text/json; x-api-version=1.0:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/LinkedLocationsMap'
          application/*+json; x-api-version=1.0:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/LinkedLocationsMap'
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: Client Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
      summary: Update linked account locations mapping
      x-summary-source: derived
  /v1/Accounts/{accountId}/linkedOperations:
    put:
      tags:
      - Accounts
      operationId: Update linked account operations mapping
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json-patch+json; x-api-version=1.0:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/LinkedOperationsMap'
          application/json; x-api-version=1.0:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/LinkedOperationsMap'
          text/json; x-api-version=1.0:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/LinkedOperationsMap'
          application/*+json; x-api-version=1.0:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/LinkedOperationsMap'
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: Client Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
      summary: Update linked account operations mapping
      x-summary-source: derived
  /v1/Accounts/{accountId}/profiles:
    post:
      tags:
      - Accounts
      summary: Add group to account. Enables group to access account
      operationId: Add related profile
      parameters:
      - name: accountId
        in: path
        description: ''
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        description: Request DTO - GroupId and IsDefault
        content:
          application/json-patch+json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/AddAccountRelatedProfileRequest'
          application/json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/AddAccountRelatedProfileRequest'
          text/json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/AddAccountRelatedProfileRequest'
          application/*+json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/AddAccountRelatedProfileRequest'
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: Client Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
  /v1/Accounts/{accountId}/profiles/{userProfileId}:
    delete:
      tags:
      - Accounts
      summary: Remove related profile from the account
      operationId: Delete related profile
      parameters:
      - name: accountId
        in: path
        description: ''
        required: true
        schema:
          type: integer
          format: int32
      - name: userProfileId
        in: path
        description: ''
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: Client Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
  /v1/Accounts/vendors:
    get:
      tags:
      - Accounts
      summary: Returns the list of vendors of an account
      operationId: Account vendors
      parameters:
      - name: Filter
        in: query
        schema:
          type: string
      - name: Page
        in: query
        schema:
          type: integer
          format: int32
      - name: PageSize
        in: query
        schema:
          type: integer
          format: int32
      - name: SortColumn
        in: query
        schema:
          type: string
      - name: SortOrder
        in: query
        schema:
          type: string
      - name: locationId
        in: query
        schema:
          type: integer
          format: int32
      - name: Account
        in: query
        description: Account
        schema:
          title: Account
          type: int
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountVendorResult'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
  /v1/Accounts/invitation:
    get:
      tags:
      - Accounts
      summary: Get data from the inviter's tenant regarding account
      operationId: Client accepts vendor invitation
      parameters:
      - name: tenantId
        in: query
        description: Inviter's tenant id
        schema:
          type: string
          format: uuid
      - name: recordId
        in: query
        description: Id of the record
        schema:
          type: integer
          format: int32
      - name: Account
        in: query
        description: Account
        schema:
          title: Account
          type: int
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkedAccountSettingsDataResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Client Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
    post:
      tags:
      - Accounts
      summary: Inviter creates an invitation
      operationId: Vendor invitation
      parameters:
      - name: Account
        in: query
        description: Account
        schema:
          title: Account
          type: int
      requestBody:
        description: ''
        content:
          application/json-patch+json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/CreateAccountInvetationRequest'
          application/json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/CreateAccountInvetationRequest'
          text/json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/CreateAccountInvetationRequest'
          application/*+json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/CreateAccountInvetationRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAccountInvetationResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Client Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
  /v1/Accounts/linkedClientsTenants:
    get:
      tags:
      - Accounts
      summary: Get all tenants linked to account
      operationId: Account's clients' tenants
      parameters:
      - name: Account
        in: query
        description: Account
        schema:
          title: Account
          type: int
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientTenantResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Client Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
  /v1/Accounts/{accountId}/linkedSettings/validation:
    get:
      tags:
      - Accounts
      summary: Validate that a linked (vendor) account is fully configured for cross-tenant…
      operationId: Validate linked account configuration
      parameters:
      - name: accountId
        in: path
        description: Linked account id
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkedAccountValidationResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
  /v1/Accounts/integration:
    delete:
      tags:
      - Accounts
      summary: Delete account invitation
      operationId: Delete account integration
      parameters:
      - name: recordId
        in: query
        description: ''
        schema:
          type: integer
          format: int32
      - name: Account
        in: query
        description: Account
        schema:
          title: Account
          type: int
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: Client Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
  /v1/Accounts/validate:
    get:
      tags:
      - Accounts
      summary: Validates whether a single account code exists
      parameters:
      - name: accountCode
        in: query
        schema:
          type: string
      - name: Account
        in: query
        description: Account
        schema:
          title: Account
          type: int
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: boolean
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
      operationId: getV1AccountsValidate
      x-operation-id-source: derived
    post:
      tags:
      - Accounts
      summary: Validates multiple account codes. Returns only invalid codes
      parameters:
      - name: Account
        in: query
        description: Account
        schema:
          title: Account
          type: int
      requestBody:
        content:
          application/json-patch+json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/ValidateAccountCodesRequest'
          application/json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/ValidateAccountCodesRequest'
          text/json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/ValidateAccountCodesRequest'
          application/*+json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/ValidateAccountCodesRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
      operationId: postV1AccountsValidate
      x-operation-id-source: derived
components:
  schemas:
    AccountResponseIPagedResult:
      type: object
      properties:
        pageSize:
          type: integer
          format: int32
          readOnly: true
        page:
          type: integer
          format: int32
          readOnly: true
        totalCount:
          type: integer
          format: int32
          readOnly: true
        filteredCount:
          type: integer
          format: int32
          readOnly: true
        data:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AccountResponse'
          readOnly: true
      additionalProperties: false
    ClientTenantResponse:
      type: object
      properties:
        tenantId:
          type: string
          format: uuid
        name:
          type:
          - string
          - 'null'
        accountId:
          type: integer
          format: int32
      additionalProperties: false
    ValidateAccountCodesRequest:
      type: object
      properties:
        accountCodes:
          type:
          - array
          - 'null'
          items:
            type: string
      additionalProperties: false
    ProblemDetails:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
      additionalProperties: {}
    CreateAccountInvetationResponse:
      type: object
      properties:
        tenantId:
          type: string
          format: uuid
        linkedAccountSettingsId:
          type: integer
          format: int32
      additionalProperties: false
    LinkedAccountValidationResponse:
      type: object
      properties:
        accountId:
          type: integer
          format: int32
        isComplete:
          type: boolean
        tenantLinked:
          type: boolean
        hasLocationMappings:
          type: boolean
        hasOperationMappings:
          type: boolean
        unmappedLocations:
          type:
          - array
          - 'null'
          items:
            type: string
        unmappedOperations:
          type:
          - array
          - 'null'
          items:
            type: string
        issues:
          type:
          - array
          - 'null'
          items:
            type: string
      additionalProperties: false
    LinkedOperationsMap:
      type: object
      properties:
        id:
          type: integer
          format: int32
        genericOperationType:
          type:
          - string
          - 'null'
        operationId:
          type:
          - integer
          - 'null'
          format: int32
        externalOperationId:
          type:
          - integer
