openapi: 3.2.0
info:
  title: IO.Reports Scans API
  version: '1.0'
tags:
- name: Scans
paths:
  /api/v1/Scans:
    get:
      tags:
      - Scans
      summary: Get scan events.
      parameters:
      - name: locationId
        in: query
        schema:
          type: integer
          format: int32
      - name: accountId
        in: query
        schema:
          type: integer
          format: int32
      - name: userAccountId
        in: query
        schema:
          type: integer
          format: int32
      - name: type
        in: query
        schema:
          type: string
          default: ''
      - name: dateFrom
        in: query
        schema:
          type: string
          format: date-time
      - name: dateTo
        in: query
        schema:
          type: string
          format: date-time
      - name: sessionId
        in: query
        schema:
          type: integer
          format: int32
      - name: userId
        in: query
        schema:
          type: integer
          format: int32
      - name: operationName
        in: query
        schema:
          type: string
      - name: searchTerm
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScanEventReportRowDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.reporting
      operationId: getApiV1Scans
      x-operation-id-source: derived
  /api/v1/Scans/my:
    get:
      tags:
      - Scans
      summary: Get user's scan events.
      parameters:
      - name: locationId
        in: query
        schema:
          type: integer
          format: int32
      - name: accountId
        in: query
        schema:
          type: integer
          format: int32
      - name: type
        in: query
        schema:
          type: string
          default: ''
      - name: dateFrom
        in: query
        schema:
          type: string
          format: date-time
      - name: dateTo
        in: query
        schema:
          type: string
          format: date-time
      - name: sessionId
        in: query
        schema:
          type: integer
          format: int32
      - name: userId
        in: query
        schema:
          type: integer
          format: int32
      - name: operationName
        in: query
        schema:
          type: string
      - name: searchTerm
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScanEventReportRowDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.reporting
      operationId: getApiV1ScansMy
      x-operation-id-source: derived
  /api/v1/Scans/anonymous:
    get:
      tags:
      - Scans
      summary: Get anonymous scan events
      parameters:
      - name: locationId
        in: query
        schema:
          type: integer
          format: int32
      - name: accountId
        in: query
        schema:
          type: integer
          format: int32
      - name: type
        in: query
        schema:
          type: string
          default: ''
      - name: dateFrom
        in: query
        schema:
          type: string
          format: date-time
      - name: dateTo
        in: query
        schema:
          type: string
          format: date-time
      - name: sessionId
        in: query
        schema:
          type: integer
          format: int32
      - name: userId
        in: query
        schema:
          type: integer
          format: int32
      - name: operationName
        in: query
        schema:
          type: string
      - name: searchTerm
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScanEventReportRowDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.reporting
      operationId: getApiV1ScansAnonymous
      x-operation-id-source: derived
  /api/v1/Scans/count:
    get:
      tags:
      - Scans
      summary: Returns scans count by location, operation for selected period.
      parameters:
      - name: locationId
        in: query
        schema:
          type: integer
          format: int32
      - name: operationId
        in: query
        schema:
          type: integer
          format: int32
      - name: dateFrom
        in: query
        schema:
          type: string
          format: date-time
      - name: dateTo
        in: query
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LocationOperationDateScansDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.reporting
      operationId: getApiV1ScansCount
      x-operation-id-source: derived
  /api/v1/Scans/badscans:
    get:
      tags:
      - Scans
      summary: Get bad scan events
      parameters:
      - name: accountId
        in: query
        schema:
          type: integer
          format: int32
      - name: locationId
        in: query
        schema:
          type: integer
          format: int32
      - name: dateFrom
        in: query
        schema:
          type: string
          format: date-time
      - name: dateTo
        in: query
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BadScanDto'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.reporting
      operationId: getApiV1ScansBadscans
      x-operation-id-source: derived
components:
  schemas:
    LocationOperationDateScansDTO:
      type: object
      properties:
        operationId:
          type: integer
          format: int32
        locationId:
          type: integer
          format: int32
        date:
          type: string
          format: date-time
        scans:
          type: integer
          format: int64
        operationName:
          type:
          - string
          - 'null'
        locationName:
          type:
          - string
          - 'null'
      additionalProperties: false
    ScanEventReportRowDTO:
      type: object
      properties:
        scanId:
          type: integer
          format: int32
        sessionId:
          type: integer
          format: int32
        itemId:
          type:
          - integer
          - 'null'
          format: int32
        locationId:
          type: integer
          format: int32
        sessionTypeId:
          type: integer
          format: int32
        scannedData:
          type:
          - string
          - 'null'
        unit:
          type:
          - string
          - 'null'
        quantity:
          type: number
          format: double
        expectedQuantity:
          type: number
          format: double
        firmedQuantity:
          type: number
          format: double
        scanDate:
          type: string
          format: date
          readOnly: true
        scanDateTime:
          type: string
          format: date-time
        itemName:
          type:
          - string
          - 'null'
        itemCode:
          type:
          - string
          - 'null'
        altCode:
          type:
          - string
          - 'null'
        altName:
          type:
          - string
          - 'null'
        vendor:
          type:
          - string
          - 'null'
        itemUnit:
          type:
          - string
          - 'null'
        userId:
          type:
          - integer
          - 'null'
          format: int32
        user:
          type:
          - string
          - 'null'
        userFirstName:
          type:
          - string
          - 'null'
        userLastName:
          type:
          - string
          - 'null'
        userFullName:
          type:
          - string
          - 'null'
        userGroupName:
          type:
          - string
          - 'null'
        companyName:
          type:
          - string
          - 'null'
        location:
          type:
          - string
          - 'null'
        operation:
          type:
          - string
          - 'null'
        operationType:
          type:
          - string
          - 'null'
        metadata:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/MetadataDTO'
        itemProperties:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/PropertyDTO'
        userProperties:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/PropertyDTO'
      additionalProperties: false
    BadScanDto:
      type: object
      properties:
        scanId:
          type: integer
          format: int32
        locationId:
          type: integer
          format: int32
        sessionTypeId:
          type: integer
          format: int32
        sessionState:
          type: integer
          format: int32
        scanDateTime:
          type: string
          format: date-time
        itemId:
          type:
          - integer
          - 'null'
          format: int32
        itemName:
          type:
          - string
          - 'null'
        itemCode:
          type:
          - string
          - 'null'
        altCode:
          type:
          - string
          - 'null'
        altName:
          type:
          - string
          - 'null'
        barcode:
          type:
          - string
          - 'null'
        quantity:
          type:
          - number
          - 'null'
          format: double
        expectedQuantity:
          type:
          - number
          - 'null'
          format: double
        confirmedQuantity:
          type:
          - number
          - 'null'
          format: double
        rawWeight:
          type:
          - number
          - 'null'
          format: double
        itemWeight:
          type:
          - number
          - 'null'
          format: double
        itemBinWeight:
          type:
          - number
          - 'null'
          format: double
        calculatedItemWeight:
          type:
          - number
          - 'null'
          format: double
        weightDiffPercent:
          type:
          - number
          - 'null'
          format: double
        location:
          type:
          - string
          - 'null'
        wmsLocationId:
          type:
          - string
          - 'null'
        operation:
          type:
          - string
          - 'null'
      additionalProperties: false
    Error:
      type: object
      properties:
        code:
          type:
          - string
          - 'null'
        message:
          type:
          - string
          - 'null'
      additionalProperties: false
    MetadataDTO:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
        shortName:
          type:
          - string
          - 'null'
        value:
          type:
          - string
          - 'null'
        dimensionId:
          type: integer
          format: int32
      additionalProperties: false
    PropertyDTO:
      type: object
      properties:
        key:
          type:
          - string
          - 'null'
        value:
          type:
          - string
          - 'null'
      additionalProperties: false
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://identity.scanbro.com/connect/authorize
          tokenUrl: https://identity.scanbro.com/connect/token
          scopes:
            io.reporting: default scope
