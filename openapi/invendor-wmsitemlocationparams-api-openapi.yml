openapi: 3.2.0
info:
  title: IO.Common WMS Item Location Params API
  version: '1.0'
security:
- OAuth2: []
tags:
- name: WMSItemLocationParams
paths:
  /v1/WMSItemLocationParams:
    get:
      tags:
      - WMSItemLocationParams
      summary: Get location item parameters
      parameters:
      - name: locationId
        in: query
        schema:
          type: integer
          format: int32
      - name: itemId
        in: query
        schema:
          type: integer
          format: int32
      - name: vendorAccountId
        in: query
        schema:
          type: integer
          format: int32
      - name: Filter
        in: query
        schema:
          type: string
      - name: Page
        in: query
        schema:
          type: integer
          format: int32
      - name: PageSize
        in: query
        schema:
          type: integer
          format: int32
      - name: SortColumn
        in: query
        schema:
          type: string
      - name: SortOrder
        in: query
        schema:
          type: string
      - name: Account
        in: query
        description: Account
        schema:
          title: Account
          type: int
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ItemLocationParamsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
      operationId: getV1WMSItemLocationParams
      x-operation-id-source: derived
    post:
      tags:
      - WMSItemLocationParams
      summary: Create new item location parameters
      parameters:
      - name: Account
        in: query
        description: Account
        schema:
          title: Account
          type: int
      requestBody:
        content:
          application/json-patch+json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/CreateLocationsItemsParamsRequest'
          application/json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/CreateLocationsItemsParamsRequest'
          text/json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/CreateLocationsItemsParamsRequest'
          application/*+json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/CreateLocationsItemsParamsRequest'
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
      operationId: postV1WMSItemLocationParams
      x-operation-id-source: derived
  /v1/WMSItemLocationParams/{paramId}:
    get:
      tags:
      - WMSItemLocationParams
      summary: Get location item parameters by id
      parameters:
      - name: paramId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: Account
        in: query
        description: Account
        schema:
          title: Account
          type: int
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemLocationParamsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
      operationId: getV1WMSItemLocationParamsByParamId
      x-operation-id-source: derived
  /v1/WMSItemLocationParams/bulk:
    post:
      tags:
      - WMSItemLocationParams
      summary: Bulk upsert new item location parameters
      parameters:
      - name: Account
        in: query
        description: Account
        schema:
          title: Account
          type: int
      requestBody:
        content:
          application/json-patch+json; x-api-version=1.0:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/BulkUpsertItemLocationItemsParamsRequest'
          application/json; x-api-version=1.0:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/BulkUpsertItemLocationItemsParamsRequest'
          text/json; x-api-version=1.0:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/BulkUpsertItemLocationItemsParamsRequest'
          application/*+json; x-api-version=1.0:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/BulkUpsertItemLocationItemsParamsRequest'
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
      operationId: postV1WMSItemLocationParamsBulk
      x-operation-id-source: derived
  /v1/WMSItemLocationParams/{itemParamsId}:
    put:
      tags:
      - WMSItemLocationParams
      summary: Update item location parameters
      parameters:
      - name: itemParamsId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: Account
        in: query
        description: Account
        schema:
          title: Account
          type: int
      requestBody:
        content:
          application/json-patch+json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/UpdateLocationsItemsParamsRequest'
          application/json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/UpdateLocationsItemsParamsRequest'
          text/json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/UpdateLocationsItemsParamsRequest'
          application/*+json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/UpdateLocationsItemsParamsRequest'
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
      operationId: putV1WMSItemLocationParamsByItemParamsId
      x-operation-id-source: derived
    delete:
      tags:
      - WMSItemLocationParams
      summary: Delete item location parameters
      parameters:
      - name: itemParamsId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: Account
        in: query
        description: Account
        schema:
          title: Account
          type: int
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
      operationId: deleteV1WMSItemLocationParamsByItemParamsId
      x-operation-id-source: derived
  /v1/WMSItemLocationParams/bulk/delete:
    post:
      tags:
      - WMSItemLocationParams
      summary: Bulk delete item location parameters.
      parameters:
      - name: Account
        in: query
        description: Account
        schema:
          title: Account
          type: int
      requestBody:
        description: List of IDs to delete
        content:
          application/json-patch+json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/BulkDeleteItemLocationParamsRequest'
          application/json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/BulkDeleteItemLocationParamsRequest'
          text/json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/BulkDeleteItemLocationParamsRequest'
          application/*+json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/BulkDeleteItemLocationParamsRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
      operationId: postV1WMSItemLocationParamsBulkDelete
      x-operation-id-source: derived
  /v1/WMSItemLocationParams/{locationId}/{wmsLocationId}/barcodes:
    post:
      tags:
      - WMSItemLocationParams
      summary: Add barcode to item location parameters
      parameters:
      - name: locationId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: wmsLocationId
        in: path
        required: true
        schema:
          type: string
      - name: Account
        in: query
        description: Account
        schema:
          title: Account
          type: int
      requestBody:
        content:
          application/json-patch+json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/AddBarcodeToItemLocationRequest'
          application/json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/AddBarcodeToItemLocationRequest'
          text/json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/AddBarcodeToItemLocationRequest'
          application/*+json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/AddBarcodeToItemLocationRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ItemLocationParamsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
      operationId: postV1WMSItemLocationParamsByLocationIdByWmsLocationIdBarcodes
      x-operation-id-source: derived
    delete:
      tags:
      - WMSItemLocationParams
      summary: Remove item barcode from item location parameters
      parameters:
      - name: locationId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: wmsLocationId
        in: path
        required: true
        schema:
          type: string
      - name: barcode
        in: query
        schema:
          type: string
      - name: Account
        in: query
        description: Account
        schema:
          title: Account
          type: int
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ItemLocationParamsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
      operationId: deleteV1WMSItemLocationParamsByLocationIdByWmsLocationIdBarcodes
      x-operation-id-source: derived
  /v1/WMSItemLocationParams/{locationId}/download/xlsx/label:
    get:
      tags:
      - WMSItemLocationParams
      summary: Get location item parameters in xlsx file for label printing
      parameters:
      - name: locationId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: itemId
        in: query
        schema:
          type: integer
          format: int32
      - name: areaId
        in: query
        schema:
          type: integer
          format: int32
      - name: Account
        in: query
        description: Account
        schema:
          title: Account
          type: int
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: string
                format: binary
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
      operationId: getV1WMSItemLocationParamsByLocationIdDownloadXlsxLabel
      x-operation-id-source: derived
  /v1/WMSItemLocationParams/download/xlsx:
    get:
      tags:
      - WMSItemLocationParams
      summary: Get all location items in excel
      operationId: Get location items in excel
      parameters:
      - name: locationId
        in: query
        schema:
          type: integer
          format: int32
      - name: itemId
        in: query
        schema:
          type: integer
          format: int32
      - name: vendorAccountId
        in: query
        schema:
          type: integer
          format: int32
      - name: Filter
        in: query
        schema:
          type: string
      - name: Page
        in: query
        schema:
          type: integer
          format: int32
      - name: PageSize
        in: query
        schema:
          type: integer
          format: int32
      - name: SortColumn
        in: query
        schema:
          type: string
      - name: SortOrder
        in: query
        schema:
          type: string
      - name: Account
        in: query
        description: Account
        schema:
          title: Account
          type: int
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: string
                format: binary
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
components:
  schemas:
    UpdateLocationsItemsParamsRequest:
      type: object
      properties:
        itemId:
          type: integer
          format: int32
        wmsLocationId:
          type:
          - string
          - 'null'
        bufferLevel:
          type: number
          format: double
        minOrderQty:
          type: number
          format: double
        orderUnitId:
          type:
          - string
          - 'null'
        minSalesQty:
          type: number
          format: double
        salesUnitId:
          type:
          - string
          - 'null'
        dlvIntervalDays:
          type: integer
          format: int32
        dlvDurationDays:
          type: integer
          format: int32
        vendorAccountId:
          type:
          - integer
          - 'null'
          format: int32
        serviceLevel:
          $ref: '#/components/schemas/IlpServiceLevel'
      additionalProperties: false
    ApiErrorResponse:
      type: object
      properties:
        errors:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Error'
      additionalProperties: false
    CreateLocationsItemsParamsRequest:
      type: object
      properties:
        itemId:
          type: integer
          format: int32
        locationId:
          type: integer
          format: int32
        wmsLocationId:
          type:
          - string
          - 'null'
        bufferLevel:
          type: number
          format: double
        minOrderQty:
          type: number
          format: double
        orderUnitId:
          type:
          - string
          - 'null'
        minSalesQty:
          type: number
          format: double
        salesUnitId:
          type:
          - string
          - 'null'
        dlvIntervalDays:
          type: integer
          format: int32
        dlvDurationDays:
          type: integer
          format: int32
        vendorAccountId:
          type:
          - integer
          - 'null'
          format: int32
        serviceLevel:
          $ref: '#/components/schemas/IlpServiceLevel'
      additionalProperties: false
    AddBarcodeToItemLocationRequest:
      type: object
      properties:
        barcode:
          type:
          - string
          - 'null'
        weightType:
          $ref: '#/components/schemas/WeightType'
      additionalProperties: false
    WeightType:
      enum:
      - 0
      - 1
      type: integer
      format: int32
    IlpServiceLevel:
      enum:
      - 70
      - 95
      - 99
      - 100
      type: integer
      format: int32
    BulkDeleteItemLocationParamsRequest:
      type: object
      properties:
        ids:
          type:
          - array
          - 'null'
          items:
            type: integer
            format: int32
      additionalProperties: false
    Error:
      type: object
      properties:
        code:
          type:
          - string
          - 'null'
        message:
          type:
          - string
          - 'null'
      additionalProperties: false
    ItemLocationBarcodeResponse:
      type: object
      properties:
        barcode:
          type:
          - string
          - 'null'
        unitId:
          type:
          - string
          - 'null'
        weight:
          type: number
          format: double
        weightType:
          $ref: '#/components/schemas/WeightType'
        isWeightAdjusted:
          type: boolean
      additionalProperties: false
    ItemLocationParamsResponse:
      type: object
      properties:
        id:
          type: integer
          format: int32
        itemId:
          type: integer
          format: int32
        itemCode:
          type:
          - string
          - 'null'
        itemName:
          type:
          - string
          - 'null'
        inventDimId:
          type: integer
          format: int32
        locationId:
          type: integer
          format: int32
        locationName:
          type:
          - string
          - 'null'
        wmsLocationId:
          type:
          - string
          - 'null'
        wmsAreaType:
          type:
          - integer
          - 'null'
          format: int32
        bufferLevel:
          type: number
          format: double
        minOrderQty:
          type: number
          format: double
        orderUnitId:
          type:
          - string
          - 'null'
        minSalesQty:
          type: number
          format: double
        salesUnitId:
          type:
          - string
          - 'null'
        dlvIntervalDays:
          type: integer
          format: int32
        dlvDurationDays:
          type: integer
          format: int32
        vendorAccountId:
          type:
          - integer
          - 'null'
          format: int32
        vendorAccountName:
          type:
          - string
          - 'null'
        vendorAccountCode:
          type:
          - string
          - 'null'
        serviceLevel:
          $ref: '#/components/schemas/IlpServiceLevel'
        barcodes:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ItemLocationBarcodeResponse'
        deL_Alternatives:
          type:
          - array
          - 'null'
          items:
            type: string
      additionalProperties: false
    BulkUpsertItemLocationItemsParamsRequest:
      type: object
      properties:
        itemCode:
          type:
          - string
          - 'null'
        minOrderQty:
          type: number
          format: double
        orderUnitId:
          type:
          - string
          - 'null'
        bufferLevel:
          type: number
          format: double
        wmsLocationId:
          type:
          - string
          - 'null'
        vendorAccountId:
          type:
          - integer
          - 'null'
          format: int32
        vendorAccountCode:
          type:
          - string
          - 'null'
        serviceLevel:
          type: integer
          format: int32
        locationId:
          type: integer
          format: int32
      additionalProperties: false
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://identity.scanbro.com/connect/authorize
          tokenUrl: https://identity.scanbro.com/connect/token
          scopes:
            io.common: default scope
