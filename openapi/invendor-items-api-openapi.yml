        - io.common
  /v1/Items/bulk:
    post:
      tags:
      - Items
      summary: Bulk upsert items masterdata.
      description: 'NEVER call this endpoint concurrently for the same tenant.

        Concurrent calls will interfere with each other and produce incorrect results.

        All requests must be strictly sequential — wait for a 200 OK before sending the next batch.'
      operationId: BulkUpsertItem
      parameters:
      - name: serviceId
        in: query
        description: Optional service context. Omit if items are not scoped to a specific service.
        schema:
          type: string
          format: uuid
      - name: forceOverwriteOwner
        in: query
        schema:
          type: boolean
      - name: Account
        in: query
        description: Account
        schema:
          title: Account
          type: int
      requestBody:
        description: Array of items to upsert. Send at most 5 000 items per request.
        content:
          application/json-patch+json; x-api-version=1.0:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CreateItemBulkRequest'
          application/json; x-api-version=1.0:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CreateItemBulkRequest'
          text/json; x-api-version=1.0:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CreateItemBulkRequest'
          application/*+json; x-api-version=1.0:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CreateItemBulkRequest'
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
