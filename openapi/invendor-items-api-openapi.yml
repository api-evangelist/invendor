openapi: 3.2.0
info:
  title: IO.Common Items API
  version: '1.0'
security:
- OAuth2: []
tags:
- name: Items
paths:
  /v1/Items:
    get:
      tags:
      - Items
      summary: Get all items
      operationId: GetItems
      parameters:
      - name: Name
        in: query
        schema:
          type: string
      - name: Code
        in: query
        schema:
          type: string
      - name: Vendor
        in: query
        schema:
          type: string
      - name: Barcode
        in: query
        schema:
          type: string
      - name: flag
        in: query
        schema:
          type: array
          items:
            type: integer
            format: int32
      - name: Page
        in: query
        schema:
          type: integer
          format: int32
      - name: PageSize
        in: query
        schema:
          type: integer
          format: int32
      - name: SortColumn
        in: query
        schema:
          type: string
      - name: SortOrder
        in: query
        schema:
          type: string
      - name: Account
        in: query
        description: Account
        schema:
          title: Account
          type: int
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResponsePagedResult'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
    post:
      tags:
      - Items
      summary: Create new item
      operationId: CreateItem
      parameters:
      - name: serviceId
        in: query
        description: Service id of the item.
        schema:
          type: string
          format: uuid
      - name: Account
        in: query
        description: Account
        schema:
          title: Account
          type: int
      requestBody:
        description: Create item request data
        content:
          application/json-patch+json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/CreateItemRequest'
          application/json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/CreateItemRequest'
          text/json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/CreateItemRequest'
          application/*+json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/CreateItemRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: integer
                format: int32
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
  /v1/Items/{serviceId}/items:
    get:
      tags:
      - Items
      summary: Get all service items
      operationId: GetServiceItems
      parameters:
      - name: serviceId
        in: path
        description: Service id
        required: true
        schema:
          type: string
          format: uuid
      - name: Name
        in: query
        schema:
          type: string
      - name: Code
        in: query
        schema:
          type: string
      - name: Vendor
        in: query
        schema:
          type: string
      - name: Barcode
        in: query
        schema:
          type: string
      - name: flag
        in: query
        schema:
          type: array
          items:
            type: integer
            format: int32
      - name: Page
        in: query
        schema:
          type: integer
          format: int32
      - name: PageSize
        in: query
        schema:
          type: integer
          format: int32
      - name: SortColumn
        in: query
        schema:
          type: string
      - name: SortOrder
        in: query
        schema:
          type: string
      - name: Account
        in: query
        description: Account
        schema:
          title: Account
          type: int
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResponsePagedResult'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
  /v1/Items/{itemId}:
    get:
      tags:
      - Items
      summary: Get item details
      operationId: GetItemDetails
      parameters:
      - name: itemId
        in: path
        description: ''
        required: true
        schema:
          type: integer
          format: int32
      - name: Account
        in: query
        description: Account
        schema:
          title: Account
          type: int
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemDetailsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
    put:
      tags:
      - Items
      summary: Update existing item
      operationId: UpdateItem
      parameters:
      - name: itemId
        in: path
        description: Item to update
        required: true
        schema:
          type: integer
          format: int32
      - name: Account
        in: query
        description: Account
        schema:
          title: Account
          type: int
      requestBody:
        description: Update DTO
        content:
          application/json-patch+json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/UpdateItemRequest'
          application/json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/UpdateItemRequest'
          text/json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/UpdateItemRequest'
          application/*+json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/UpdateItemRequest'
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
    delete:
      tags:
      - Items
      summary: Delete item
      operationId: DeleteItem
      parameters:
      - name: itemId
        in: path
        description: Item id to delete
        required: true
        schema:
          type: integer
          format: int32
      - name: Account
        in: query
        description: Account
        schema:
          title: Account
          type: int
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
  /v1/Items/{itemId}/conversions:
