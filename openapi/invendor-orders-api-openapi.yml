components:
  schemas:
    UpdateOrderLineRequest:
      type: object
      properties:
        id:
          type: integer
          format: int32
        itemId:
          type: integer
          format: int32
        inventDim:
          $ref: '#/components/schemas/InventDimDto'
        orderQty:
          type: number
          format: double
        firmedQty:
          type: number
          format: double
        shippedQty:
          type: number
          format: double
        receivedQty:
          type: number
          format: double
      additionalProperties: false
    CreateOrUpdateOrderLocationParamRequest:
      type: object
      properties:
        locationId:
          type: integer
          format: int32
        orderAutoShip:
          type: boolean
        partialFulFillmentAllowed:
          type: boolean
      additionalProperties: false
    CreatePurchaseOrderRequest:
      type: object
      properties:
        locationId:
          type: integer
          format: int32
        vendorId:
          type: integer
          format: int32
        buyerId:
          type: integer
          format: int32
        description:
          type: string
          nullable: true
        lines:
          type: array
          items:
            $ref: '#/components/schemas/CreatePurchaseOrderLine'
          nullable: true
      additionalProperties: false
    CreatePurchaseOrderLine:
      type: object
      properties:
        itemId:
          type: integer
          format: int32
        inventDim:
          $ref: '#/components/schemas/InventDimDto'
        orderQty:
          type: number
          format: double
        unitId:
          type: string
          nullable: true
        transDate:
          type: string
          format: date-time
      additionalProperties: false
    OrderType:
      enum:
      - 10
      - 20
      - 40
      - 90
      type: integer
      format: int32
    CreateReplenishmentOrderLine:
      type: object
      properties:
        itemId:
          type: integer
          format: int32
        inventDim:
          $ref: '#/components/schemas/InventDimDto'
        orderQty:
          type: number
          format: double
        unitId:
          type: string
          nullable: true
        transDate:
          type: string
          format: date-time
      additionalProperties: false
    OrderLocationParamResponse:
      type: object
      properties:
        id:
          type: integer
          format: int32
        locationId:
          type: integer
          format: int32
        orderAutoShip:
          type: boolean
        partialFulFillmentAllowed:
          type: boolean
      additionalProperties: false
    CreateOrderLineRequest:
      type: object
      properties:
        orderId:
          type: integer
          format: int32
        transDate:
          type: string
          format: date-time
        itemId:
          type: integer
          format: int32
        inventDim:
          $ref: '#/components/schemas/InventDimDto'
        orderQty:
          type: number
          format: double
        unitId:
          type: string
          nullable: true
      additionalProperties: false
    Error:
      type: object
      properties:
        code:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
      additionalProperties: false
    OrderLineType:
      enum:
      - 10
      - 20
      type: integer
      format: int32
    OrderListResponse:
      type: object
      properties:
        id:
          type: integer
          format: int32
        orderNumber:
          type: string
          nullable: true
        externalOrderNumber:
          type: string
          nullable: true
        orderType:
          $ref: '#/components/schemas/OrderType'
        description:
          type: string
          nullable: true
        orderDate:
          type: string
          format: date-time
        orderStatus:
          $ref: '#/components/schemas/OrderStatus'
        statusDate:
          type: string
          format: date-time
        buyerAccountId:
          type: integer
          format: int32
          nullable: true
        buyerAccountName:
          type: string
          nullable: true
        vendorAccountId:
          type: integer
          format: int32
          nullable: true
        vendorAccountName:
          type: string
          nullable: true
        isReplenishmentOrder:
          type: boolean
        createdOn:
          type: string
          format: date-time
          nullable: true
        modifiedOn:
          type: string
          format: date-time
          nullable: true
        locationName:
          type: string
          nullable: true
      additionalProperties: false
    OrderDetailsResponse:
      type: object
      properties:
        id:
          type: integer
          format: int32
        orderNumber:
          type: string
          nullable: true
        externalOrderNumber:
          type: string
          nullable: true
        orderType:
          $ref: '#/components/schemas/OrderType'
        description:
          type: string
          nullable: true
        orderDate:
          type: string
          format: date-time
        orderStatus:
          $ref: '#/components/schemas/OrderStatus'
        statusDate:
          type: string
          format: date-time
        buyerAccountId:
          type: integer
          format: int32
          nullable: true
        buyerAccountName:
          type: string
          nullable: true
        vendorAccountId:
          type: integer
          format: int32
          nullable: true
        vendorAccountName:
          type: string
          nullable: true
        isReplenishmentOrder:
