openapi: 3.2.0
info:
  title: IO.Reports Questions API
  version: '1.0'
tags:
- name: Questions
paths:
  /api/v1/Questions/tools/status:
    get:
      tags:
      - Questions
      summary: Get tools status by barcode
      parameters:
      - name: barcode
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemStatusRowDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.reporting
      operationId: getApiV1QuestionsToolsStatus
      x-operation-id-source: derived
  /api/v1/Questions/user/tools:
    get:
      tags:
      - Questions
      summary: Get all tools that are in statuses provided
      parameters:
      - name: statuses
        in: query
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ItemStatusRowDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.reporting
      operationId: getApiV1QuestionsUserTools
      x-operation-id-source: derived
  /api/v1/Questions/items/consumption:
    get:
      tags:
      - Questions
      summary: Get item consumption by barcode in location
      parameters:
      - name: barcode
        in: query
        schema:
          type: string
      - name: locationId
        in: query
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemStatusRowDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.reporting
      operationId: getApiV1QuestionsItemsConsumption
      x-operation-id-source: derived
components:
  schemas:
    ApiErrorResponse:
      type: object
      properties:
        errors:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Error'
      additionalProperties: false
    ItemStatusRowDTO:
      type: object
      properties:
        itemId:
          type: integer
          format: int32
        itemCode:
          type:
          - string
          - 'null'
        itemName:
          type:
          - string
          - 'null'
        imageUrl:
          type:
          - array
          - 'null'
          items:
            type: string
        locationId:
          type: integer
          format: int32
        location:
          type:
          - string
          - 'null'
        vendor:
          type:
          - string
          - 'null'
        metadata:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/MetadataDTO'
        sessionId:
          type: integer
          format: int32
        scanEventId:
          type: integer
          format: int32
        datetime:
          type: string
          format: date-time
        returnDatetime:
          type:
          - string
          - 'null'
          format: date-time
        operationId:
          type: integer
          format: int32
        operation:
          type:
          - string
          - 'null'
        status:
          type:
          - string
          - 'null'
        itemType:
          type:
          - string
          - 'null'
        currentUserId:
          type: integer
          format: int32
        currentUser:
          type:
          - string
          - 'null'
        currentUserFirstName:
          type:
          - string
          - 'null'
        currentUserLastName:
          type:
          - string
          - 'null'
        currentUserFullName:
          type:
          - string
          - 'null'
        previousUserId:
          type:
          - integer
          - 'null'
          format: int32
        previousUser:
          type:
          - string
          - 'null'
        previousUserFirstName:
          type:
          - string
          - 'null'
        previousUserLastName:
          type:
          - string
          - 'null'
        previousUserFullName:
          type:
          - string
          - 'null'
        itemProperties:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/PropertyDTO'
      additionalProperties: false
    PropertyDTO:
      type: object
      properties:
        key:
          type:
          - string
          - 'null'
        value:
          type:
          - string
          - 'null'
      additionalProperties: false
    Error:
      type: object
      properties:
        code:
          type:
          - string
          - 'null'
        message:
          type:
          - string
          - 'null'
      additionalProperties: false
    MetadataDTO:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
        shortName:
          type:
          - string
          - 'null'
        value:
          type:
          - string
          - 'null'
        dimensionId:
          type: integer
          format: int32
      additionalProperties: false
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://identity.scanbro.com/connect/authorize
          tokenUrl: https://identity.scanbro.com/connect/token
          scopes:
            io.reporting: default scope
