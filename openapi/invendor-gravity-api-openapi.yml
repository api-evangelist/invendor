openapi: 3.2.0
info:
  title: IO.Reports Gravity API
  version: '1.0'
tags:
- name: Gravity
paths:
  /api/v1/Gravity/bins/state:
    get:
      tags:
      - Gravity
      summary: Get gravity bin health stats
      parameters:
      - name: locationId
        in: query
        schema:
          type: integer
          format: int32
      - name: dateFrom
        in: query
        schema:
          type: string
          format: date-time
      - name: dateTo
        in: query
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GravityBinHealthStats'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.reporting
      operationId: getApiV1GravityBinsState
      x-operation-id-source: derived
components:
  schemas:
    Error:
      type: object
      properties:
        code:
          type:
          - string
          - 'null'
        message:
          type:
          - string
          - 'null'
      additionalProperties: false
    GravityBinHealthStats:
      type: object
      properties:
        wmsLocationId:
          type:
          - string
          - 'null'
        itemCode:
          type:
          - string
          - 'null'
        itemName:
          type:
          - string
          - 'null'
        pro:
          type: integer
          format: int32
        pri:
          type: integer
          format: int32
        wPlus:
          type: integer
          format: int32
        wMinus:
          type: integer
          format: int32
        totalSessions:
          type: integer
          format: int32
        totalScans:
          type: integer
          format: int32
        pRate:
          type: number
          format: double
        wRate:
          type: number
          format: double
        activityRate:
          type: number
          format: double
        score:
          type: number
          format: double
      additionalProperties: false
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://identity.scanbro.com/connect/authorize
          tokenUrl: https://identity.scanbro.com/connect/token
          scopes:
            io.reporting: default scope
