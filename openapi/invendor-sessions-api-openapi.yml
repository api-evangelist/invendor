openapi: 3.0.1
info:
  title: IO.Common Accounts Sessions API
  version: '1.0'
security:
- OAuth2: []
tags:
- name: Sessions
paths:
  /api/v1/Sessions:
    get:
      tags:
      - Sessions
      summary: Get all the sessions in defined period
      parameters:
      - name: accountId
        in: query
        schema:
          type: integer
          format: int32
      - name: dateFrom
        in: query
        schema:
          type: string
          format: date-time
      - name: dateTo
        in: query
        schema:
          type: string
          format: date-time
      - name: userId
        in: query
        schema:
          type: integer
          format: int32
      - name: locationId
        in: query
        schema:
          type: integer
          format: int32
      - name: operationName
        in: query
        schema:
          type: string
      - name: searchTerm
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionReportRowDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.reporting
  /api/v1/Sessions/empty:
    get:
      tags:
      - Sessions
      summary: Get all the empty sessions in defined period. Empty sessions are sessions without any scans.
      parameters:
      - name: accountId
        in: query
        schema:
          type: integer
          format: int32
      - name: dateFrom
        in: query
        schema:
          type: string
          format: date-time
      - name: dateTo
        in: query
        schema:
          type: string
          format: date-time
      - name: userId
        in: query
        schema:
          type: integer
          format: int32
      - name: locationId
        in: query
        schema:
          type: integer
          format: int32
      - name: operationName
        in: query
        schema:
          type: string
      - name: searchTerm
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionReportRowDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.reporting
components:
  schemas:
    ScanEventReportRowDTO:
      type: object
      properties:
        scanId:
          type: integer
          format: int32
        sessionId:
          type: integer
          format: int32
        itemId:
          type: integer
          format: int32
          nullable: true
        locationId:
          type: integer
          format: int32
        sessionTypeId:
          type: integer
          format: int32
        scannedData:
          type: string
          nullable: true
        unit:
          type: string
          nullable: true
        quantity:
          type: number
          format: double
        expectedQuantity:
          type: number
          format: double
        firmedQuantity:
          type: number
          format: double
        scanDate:
          type: string
          format: date
          readOnly: true
        scanDateTime:
          type: string
          format: date-time
        itemName:
          type: string
          nullable: true
        itemCode:
          type: string
          nullable: true
        altCode:
          type: string
          nullable: true
        altName:
          type: string
          nullable: true
        vendor:
          type: string
          nullable: true
        itemUnit:
          type: string
          nullable: true
        userId:
          type: integer
          format: int32
          nullable: true
        user:
          type: string
          nullable: true
        userFirstName:
          type: string
          nullable: true
        userLastName:
          type: string
          nullable: true
        userFullName:
          type: string
          nullable: true
        userGroupName:
          type: string
          nullable: true
        companyName:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        operation:
          type: string
          nullable: true
        operationType:
          type: string
          nullable: true
        metadata:
          type: array
          items:
            $ref: '#/components/schemas/MetadataDTO'
          nullable: true
        itemProperties:
          type: array
          items:
            $ref: '#/components/schemas/PropertyDTO'
          nullable: true
        userProperties:
          type: array
          items:
            $ref: '#/components/schemas/PropertyDTO'
          nullable: true
      additionalProperties: false
    MetadataDTO:
      type: object
      properties:
        name:
          type: string
          nullable: true
        shortName:
          type: string
          nullable: true
        value:
          type: string
          nullable: true
        dimensionId:
          type: integer
          format: int32
      additionalProperties: false
    PropertyDTO:
      type: object
      properties:
        key:
          type: string
          nullable: true
        value:
          type: string
          nullable: true
      additionalProperties: false
    Error:
      type: object
      properties:
        code:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
      additionalProperties: false
    SessionReportRowDTO:
      type: object
      properties:
        sessionId:
          type: integer
          format: int32
        locationId:
          type: integer
          format: int32
        sessionTypeId:
          type: integer
          format: int32
        userId:
          type: integer
          format: int32
        user:
          type: string
          nullable: true
        userFirstName:
          type: string
          nullable: true
        userLastName:
          type: string
          nullable: true
        userFullName:
          type: string
          nullable: true
        userGroupName:
          type: string
          nullable: true
        companyName:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        operation:
          type: string
          nullable: true
        serverDateTime:
          type: string
          format: date-time
        closeDateTime:
          type: string
          format: date-time
        openDateTime:
          type: string
          format: date-time
        durationSec:
          type: number
          format: double
        numberOfScans:
          type: integer
          format: int32
          readOnly: true
        scanEvents:
          type: array
          items:
            $ref: '#/components/schemas/ScanEventReportRowDTO'
          nullable: true
        metadata:
          type: array
          items:
            $ref: '#/components/schemas/MetadataDTO'
          nullable: true
      additionalProperties: false
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://identity.scanbro.com/connect/authorize
          tokenUrl: https://identity.scanbro.com/connect/token
          scopes:
            io.common: default scope
