          - string
          - 'null'
        itemUnit:
          type:
          - string
          - 'null'
        userId:
          type:
          - integer
          - 'null'
          format: int32
        user:
          type:
          - string
          - 'null'
        userFirstName:
          type:
          - string
          - 'null'
        userLastName:
          type:
          - string
          - 'null'
        userFullName:
          type:
          - string
          - 'null'
        userGroupName:
          type:
          - string
          - 'null'
        companyName:
          type:
          - string
          - 'null'
        location:
          type:
          - string
          - 'null'
        operation:
          type:
          - string
          - 'null'
        operationType:
          type:
          - string
          - 'null'
        metadata:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/MetadataDTO'
        itemProperties:
