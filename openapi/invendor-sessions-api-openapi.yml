          - string
          - 'null'
        quantity:
          type: number
          format: double
        expectedQuantity:
          type: number
          format: double
        firmedQuantity:
          type: number
          format: double
        scanDate:
          type: string
          format: date
          readOnly: true
        scanDateTime:
          type: string
          format: date-time
        itemName:
          type:
          - string
          - 'null'
        itemCode:
