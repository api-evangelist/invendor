openapi: 3.2.0
info:
  title: IO.Reports Sessions API
  version: '1.0'
tags:
- name: Sessions
paths:
  /api/v1/Sessions:
    get:
      tags:
      - Sessions
      summary: Get all the sessions in defined period
      parameters:
      - name: accountId
        in: query
        schema:
          type: integer
          format: int32
      - name: dateFrom
        in: query
        schema:
          type: string
          format: date-time
      - name: dateTo
        in: query
        schema:
          type: string
          format: date-time
      - name: userId
        in: query
        schema:
          type: integer
          format: int32
      - name: locationId
        in: query
        schema:
          type: integer
          format: int32
      - name: operationName
        in: query
        schema:
          type: string
      - name: searchTerm
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionReportRowDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.reporting
      operationId: getApiV1Sessions
      x-operation-id-source: derived
  /api/v1/Sessions/empty:
    get:
      tags:
      - Sessions
      summary: Get all the empty sessions in defined period.
      parameters:
      - name: accountId
        in: query
        schema:
          type: integer
          format: int32
      - name: dateFrom
        in: query
        schema:
          type: string
          format: date-time
      - name: dateTo
        in: query
        schema:
          type: string
          format: date-time
      - name: userId
        in: query
        schema:
          type: integer
          format: int32
      - name: locationId
        in: query
        schema:
          type: integer
          format: int32
      - name: operationName
        in: query
        schema:
          type: string
      - name: searchTerm
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionReportRowDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.reporting
      operationId: getApiV1SessionsEmpty
      x-operation-id-source: derived
components:
