      tags:
      - Operations
      summary: Update the Issue / Receive unique-item status assignments for an operation.
      operationId: Update operation unique-item statuses
      parameters:
      - name: operationId
        in: path
        description: Operation Id
        required: true
        schema:
          type: integer
          format: int32
      - name: Account
        in: query
        description: Account
        schema:
          title: Account
          type: int
      requestBody:
        description: Unique-item status assignments (both nullable; null clears).
        content:
          application/json-patch+json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/UpdateOperationUniqueItemStatusesRequest'
          application/json; x-api-version=1.0:
