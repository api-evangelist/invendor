  /v1/Operations/{operationId}/operation-flags:
    put:
      tags:
      - Operations
      summary: "Bulk-replace the per-operation flag configuration. PUT semantics: the body\r\nlists every desired `(FlagTypeId, FlagActionType)` tuple; missing rows\r\nare deleted, new rows are added, intersections are kept untouched. Rejects\r\nany payload that declares both `Raise` and `Clear` for the same\r\n`FlagTypeId`. Feature-gated on `\"UNIQUE_ITEMS\"`."
      operationId: Update operation flags (bulk replace)
      parameters:
      - name: operationId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: Account
        in: query
        description: Account
        schema:
          title: Account
          type: int
      requestBody:
        content:
          application/json-patch+json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/UpdateOperationFlagsRequest'
          application/json; x-api-version=1.0:
            schema:
