openapi: 3.0.1
info:
  title: IO.Common Accounts Barcodes API
  version: '1.0'
security:
- OAuth2: []
tags:
- name: Barcodes
paths:
  /v1/Barcodes/item/scaleLocker:
    get:
      tags:
      - Barcodes
      summary: Get all items barcodes that has weight defined for scale locker. Filter is applied on Barcode, ItemCode and ItemName.
      operationId: Get all items barcodes for scale lockers
      parameters:
      - name: Filter
        in: query
        schema:
          type: string
      - name: Page
        in: query
        schema:
          type: integer
          format: int32
      - name: PageSize
        in: query
        schema:
          type: integer
          format: int32
      - name: SortColumn
        in: query
        schema:
          type: string
      - name: SortOrder
        in: query
        schema:
          type: string
      - name: Account
        in: query
        description: Account
        schema:
          title: Account
          type: int
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemBarcodeSearchResponsePagedResult'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
components:
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
      additionalProperties: false
    ApiErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
          nullable: true
      additionalProperties: false
    ItemBarcodeSearchResponsePagedResult:
      type: object
      properties:
        pageSize:
          type: integer
          format: int32
          readOnly: true
        page:
          type: integer
          format: int32
          readOnly: true
        totalCount:
          type: integer
          format: int32
          readOnly: true
        filteredCount:
          type: integer
          format: int32
          readOnly: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/ItemBarcodeSearchResponse'
          nullable: true
          readOnly: true
      additionalProperties: false
    ItemBarcodeSearchResponse:
      type: object
      properties:
        barcode:
          type: string
          nullable: true
        itemCode:
          type: string
          nullable: true
        itemName:
          type: string
          nullable: true
        altItemCode:
          type: string
          nullable: true
        altItemName:
          type: string
          nullable: true
        unit:
          type: string
          nullable: true
        quantity:
          type: number
          format: double
        netWeight:
          type: number
          format: double
        grossWeight:
          type: number
          format: double
      additionalProperties: false
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://identity.scanbro.com/connect/authorize
          tokenUrl: https://identity.scanbro.com/connect/token
          scopes:
            io.common: default scope
