openapi: 3.2.0
info:
  title: IO.Reports Unique Items API
  version: '1.0'
tags:
- name: UniqueItems
paths:
  /api/v1/UniqueItems/tools:
    get:
      tags:
      - UniqueItems
      summary: Get status of all the tools in the system for defined period
      parameters:
      - name: dateFrom
        in: query
        schema:
          type: string
          format: date-time
      - name: dateTo
        in: query
        schema:
          type: string
          format: date-time
      - name: status
        in: query
        schema:
          type: string
          default: ''
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ItemStatusRowDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.reporting
      operationId: getApiV1UniqueItemsTools
      x-operation-id-source: derived
  /api/v1/UniqueItems/rent:
    get:
      tags:
      - UniqueItems
      summary: Get status of all the rent items in the system for defined period
      parameters:
      - name: dateFrom
        in: query
        schema:
          type: string
          format: date-time
      - name: dateTo
        in: query
        schema:
          type: string
          format: date-time
      - name: status
        in: query
        schema:
          type: string
          default: ''
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ItemStatusRowDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.reporting
      operationId: getApiV1UniqueItemsRent
      x-operation-id-source: derived
  /api/v1/UniqueItems/statuses:
    get:
      tags:
      - UniqueItems
      summary: Get the current status snapshot for every unique item, scoped to caller's…
      parameters:
      - name: locationId
        in: query
        schema:
          type: integer
          format: int32
      - name: statusId
        in: query
        schema:
          type: integer
          format: int32
      - name: genericStatus
        in: query
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UniqueItemCurrentStatusRowDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.reporting
      operationId: getApiV1UniqueItemsStatuses
      x-operation-id-source: derived
