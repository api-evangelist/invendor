openapi: 3.2.0
info:
  title: IO.Reports Replenishment API
  version: '1.0'
tags:
- name: Replenishment
paths:
  /api/v1/Replenishment:
    get:
      tags:
      - Replenishment
      summary: Get replenishment data
      parameters:
      - name: dateFrom
        in: query
        schema:
          type: string
          format: date-time
      - name: dateTo
        in: query
        schema:
          type: string
          format: date-time
      - name: itemId
        in: query
        schema:
          type: integer
          format: int32
      - name: locationId
        in: query
        schema:
          type: integer
          format: int32
      - name: accountId
        in: query
        schema:
          type: integer
          format: int32
      - name: vendor
        in: query
        schema:
          type: string
          default: ''
      - name: vendorAccountId
        in: query
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReplenishmentReportDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.reporting
      operationId: getApiV1Replenishment
      x-operation-id-source: derived
  /api/v1/Replenishment/order:
    get:
      tags:
      - Replenishment
      summary: Get replenishment order - for current state of inventory
      parameters:
      - name: accountId
        in: query
        schema:
          type: integer
          format: int32
      - name: locationId
        in: query
        schema:
          type: integer
          format: int32
      - name: vendor
        in: query
        schema:
          type: string
          default: ''
      - name: vendorAccountId
        in: query
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReplenishmentOrderRowDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.reporting
      operationId: getApiV1ReplenishmentOrder
      x-operation-id-source: derived
  /api/v1/Replenishment/orderlines:
    get:
      tags:
      - Replenishment
      summary: Returns order lines for selected location, vendor and up to defined order…
      parameters:
      - name: accountId
        in: query
        schema:
          type: integer
          format: int32
      - name: locationId
        in: query
        schema:
          type: integer
          format: int32
      - name: vendor
        in: query
        schema:
          type: string
          default: ''
      - name: orderStatus
        in: query
        schema:
          $ref: '#/components/schemas/OrderStatus'
      - name: lineStatus
        in: query
        schema:
          $ref: '#/components/schemas/OrderLineStatus'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReplenishementOrderLineDto'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.reporting
      operationId: getApiV1ReplenishmentOrderlines
      x-operation-id-source: derived
components:
  schemas:
    OrderStatus:
      enum:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      type: integer
      format: int32
    ReplenishmentOrderRowDTO:
      type: object
      properties:
        itemId:
          type: integer
          format: int32
        name:
          type:
          - string
          - 'null'
        code:
          type:
          - string
          - 'null'
        altName:
          type:
          - string
          - 'null'
        altCode:
          type:
          - string
          - 'null'
        locationId:
          type: integer
          format: int32
        wmsLocationId:
          type:
          - string
          - 'null'
        location:
          type:
          - string
          - 'null'
        diff:
          type: number
          format: double
        inventUnitId:
          type:
          - string
          - 'null'
        orderQty:
          type: number
          format: double
        moq:
          type: number
          format: double
        orderUnit:
          type:
          - string
          - 'null'
        vendor:
          type:
          - string
          - 'null'
        itemProperties:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/PropertyDTO'
      additionalProperties: false
    Error:
      type: object
      properties:
        code:
          type:
          - string
          - 'null'
        message:
          type:
          - string
          - 'null'
      additionalProperties: false
    ReplenishementOrderLineDto:
      type: object
      properties:
        orderId:
          type: integer
          format: int32
        globalOrderId:
          type: string
          format: uuid
        orderLineId:
          type: integer
          format: int32
        itemId:
          type: integer
          format: int32
        name:
          type:
          - string
          - 'null'
        code:
          type:
          - string
          - 'null'
        altName:
          type:
          - string
          - 'null'
        altCode:
          type:
          - string
          - 'null'
        locationId:
          type: integer
          format: int32
        wmsLocationId:
          type:
          - string
          - 'null'
        location:
          type:
          - string
          - 'null'
        inventUnitId:
          type:
          - string
          - 'null'
        orderQty:
          type: number
          format: double
        firmedQty:
          type:
          - number
          - 'null'
          format: double
        shippedQty:
          type:
          - number
          - 'null'
          format: double
        receivedQty:
          type:
          - number
          - 'null'
          format: double
        orderUnit:
          type:
          - string
          - 'null'
        vendor:
          type:
          - string
          - 'null'
        itemProperties:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/PropertyDTO'
        locationProperties:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/PropertyDTO'
      additionalProperties: false
    ReplenishmentReportDTO:
      type: object
      properties:
        itemId:
          type: integer
          format: int32
        locationParamId:
          type:
          - integer
          - 'null'
          format: int32
        inventDimId:
          type: integer
          format: int32
        locationId:
          type: integer
          format: int32
        wmsLocationId:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
        code:
          type:
          - string
          - 'null'
        altName:
          type:
          - string
          - 'null'
        altCode:
          type:
          - string
          - 'null'
        vendor:
          type:
          - string
          - 'null'
        location:
          type:
          - string
          - 'null'
        moq:
          type: number
          format: double
        buffer:
          type: number
          format: double
        onHand:
          type: number
          format: double
        onOrder:
          type: number
          format: double
        ordered:
          type: number
          format: double
        orderUnit:
          type:
          - string
          - 'null'
        inventUnit:
          type:
          - string
          - 'null'
        diff:
          type: number
          format: double
        orderQty:
          type: number
          format: double
        periodConsumption:
          type: number
          format: double
        bufferPerc:
          type: number
          format: double
        itemProperties:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/PropertyDTO'
      additionalProperties: false
    PropertyDTO:
      type: object
      properties:
        key:
          type:
          - string
          - 'null'
        value:
          type:
          - string
          - 'null'
      additionalProperties: false
    OrderLineStatus:
      enum:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      type: integer
      format: int32
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://identity.scanbro.com/connect/authorize
          tokenUrl: https://identity.scanbro.com/connect/token
          scopes:
            io.reporting: default scope
