openapi: 3.2.0
info:
  title: IO.Common WMS Locations API
  version: '1.0'
security:
- OAuth2: []
tags:
- name: WMSLocations
paths:
  /v1/WMSLocations/{locationId}/areas:
    get:
      tags:
      - WMSLocations
      summary: Get all location areas
      parameters:
      - name: locationId
        in: path
        description: ''
        required: true
        schema:
          type: integer
          format: int32
      - name: Account
        in: query
        description: Account
        schema:
          title: Account
          type: int
      responses:
        '200':
          description: Success
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
      operationId: getV1WMSLocationsByLocationIdAreas
      x-operation-id-source: derived
    post:
      tags:
      - WMSLocations
      summary: Create new area for location. (All the lockers etc must be defined as areas)
      parameters:
      - name: locationId
        in: path
        description: ''
        required: true
        schema:
          type: integer
          format: int32
      - name: Account
        in: query
        description: Account
        schema:
          title: Account
          type: int
      requestBody:
        description: ''
        content:
          application/json-patch+json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/CreateWMSAreaRequest'
          application/json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/CreateWMSAreaRequest'
          text/json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/CreateWMSAreaRequest'
          application/*+json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/CreateWMSAreaRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Int32ResourceCreatedResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
      operationId: postV1WMSLocationsByLocationIdAreas
      x-operation-id-source: derived
  /v1/WMSLocations/{locationId}/areas/{areaId}:
    get:
      tags:
      - WMSLocations
      summary: Get location area details
      parameters:
      - name: locationId
        in: path
        description: LocationId
        required: true
        schema:
          type: integer
          format: int32
      - name: areaId
        in: path
        description: AreaId
        required: true
        schema:
          type: integer
          format: int32
      - name: Account
        in: query
        description: Account
        schema:
          title: Account
          type: int
      responses:
        '200':
          description: Success
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
      operationId: getV1WMSLocationsByLocationIdAreasByAreaId
      x-operation-id-source: derived
    put:
      tags:
      - WMSLocations
      summary: Update WMSArea
      parameters:
      - name: locationId
        in: path
        description: ''
        required: true
        schema:
          type: integer
          format: int32
      - name: areaId
        in: path
        description: ''
        required: true
        schema:
          type: integer
          format: int32
      - name: Account
        in: query
        description: Account
        schema:
          title: Account
          type: int
      requestBody:
        description: ''
        content:
          application/json-patch+json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/UpdateWMSAreaRequest'
          application/json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/UpdateWMSAreaRequest'
          text/json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/UpdateWMSAreaRequest'
          application/*+json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/UpdateWMSAreaRequest'
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
      operationId: putV1WMSLocationsByLocationIdAreasByAreaId
      x-operation-id-source: derived
    delete:
      tags:
      - WMSLocations
      summary: Delete an selected area
      parameters:
      - name: locationId
        in: path
        description: ''
        required: true
        schema:
          type: integer
          format: int32
      - name: areaId
        in: path
        description: ''
        required: true
        schema:
          type: integer
          format: int32
      - name: Account
        in: query
        description: Account
        schema:
          title: Account
          type: int
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
      operationId: deleteV1WMSLocationsByLocationIdAreasByAreaId
      x-operation-id-source: derived
  /v1/WMSLocations/areas/cabinet/attach:
    post:
      tags:
      - WMSLocations
      summary: Attach WMS location to cabinet
      operationId: Attach WMS location to cabinet
      parameters:
      - name: Account
        in: query
        description: Account
        schema:
          title: Account
          type: int
      requestBody:
        description: JSON object
        content:
          application/json-patch+json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/AttachWmsLocationToCabinetRequest'
          application/json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/AttachWmsLocationToCabinetRequest'
          text/json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/AttachWmsLocationToCabinetRequest'
          application/*+json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/AttachWmsLocationToCabinetRequest'
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
  /v1/WMSLocations/{locationId}/addresses:
    get:
      tags:
      - WMSLocations
      summary: Get location wms addresses
      parameters:
      - name: locationId
        in: path
        description: Location id
        required: true
        schema:
          type: integer
          format: int32
      - name: WMSAreaId
        in: query
        schema:
          type: string
      - name: Rack
        in: query
        schema:
          type: integer
          format: int32
      - name: Shelf
        in: query
        schema:
          type: integer
          format: int32
      - name: Bin
        in: query
        schema:
          type: integer
          format: int32
      - name: WithoutGravity
        in: query
        schema:
          type: boolean
      - name: Filter
        in: query
        schema:
          type: string
      - name: Page
        in: query
        schema:
          type: integer
          format: int32
      - name: PageSize
        in: query
        schema:
          type: integer
          format: int32
      - name: SortColumn
        in: query
        schema:
          type: string
      - name: SortOrder
        in: query
        schema:
          type: string
      - name: Account
        in: query
        description: Account
        schema:
          title: Account
          type: int
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WMSLocationResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
      operationId: getV1WMSLocationsByLocationIdAddresses
      x-operation-id-source: derived
    post:
      tags:
      - WMSLocations
      summary: Create new wh address for area
      parameters:
      - name: locationId
        in: path
        description: ''
        required: true
        schema:
          type: integer
          format: int32
      - name: Account
        in: query
        description: Account
        schema:
          title: Account
          type: int
      requestBody:
        description: ''
        content:
          application/json-patch+json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/CreateAreaWMSLocationRequest'
          application/json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/CreateAreaWMSLocationRequest'
          text/json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/CreateAreaWMSLocationRequest'
          application/*+json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/CreateAreaWMSLocationRequest'
      responses:
        '201':
          description: Created
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
      operationId: postV1WMSLocationsByLocationIdAddresses
      x-operation-id-source: derived
  /v1/WMSLocations/{locationId}/addresses/bulk:
    post:
      tags:
      - WMSLocations
      summary: Bulk insert of wh address for area
      parameters:
      - name: locationId
        in: path
        description: ''
        required: true
        schema:
          type: integer
          format: int32
      - name: Account
        in: query
        description: Account
        schema:
          title: Account
          type: int
      requestBody:
        description: ''
        content:
          application/json-patch+json; x-api-version=1.0:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CreateAreaWMSLocationRequest'
          application/json; x-api-version=1.0:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CreateAreaWMSLocationRequest'
          text/json; x-api-version=1.0:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CreateAreaWMSLocationRequest'
          application/*+json; x-api-version=1.0:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CreateAreaWMSLocationRequest'
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
      operationId: postV1WMSLocationsByLocationIdAddressesBulk
      x-operation-id-source: derived
  /v1/WMSLocations/{locationId}/addresses/{wmsLocationId}:
    delete:
      tags:
      - WMSLocations
      summary: Delete wh address in a location by address
      parameters:
      - name: locationId
        in: path
        description: ''
        required: true
        schema:
          type: integer
          format: int32
      - name: wmsLocationId
        in: path
        description: ''
        required: true
        schema:
          type: string
      - name: Account
        in: query
        description: Account
        schema:
          title: Account
          type: int
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
      operationId: deleteV1WMSLocationsByLocationIdAddressesByWmsLocationId
      x-operation-id-source: derived
  /v1/WMSLocations/{locationId}/addresses/generate:
    post:
      tags:
      - WMSLocations
      summary: Generate wh aadresses on predefined parameters
      parameters:
      - name: locationId
        in: path
        description: ''
        required: true
        schema:
          type: integer
          format: int32
      - name: Account
        in: query
        description: Account
        schema:
          title: Account
          type: int
      requestBody:
        description: ''
        content:
          application/json-patch+json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/GenerateWMSLocationsRequest'
          application/json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/GenerateWMSLocationsRequest'
          text/json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/GenerateWMSLocationsRequest'
          application/*+json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/GenerateWMSLocationsRequest'
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
      operationId: postV1WMSLocationsByLocationIdAddressesGenerate
      x-operation-id-source: derived
  /v1/WMSLocations/{locationId}/addresses/delete:
    post:
      tags:
      - WMSLocations
      summary: Delete selected or all wh aadresses in a location
      parameters:
      - name: locationId
        in: path
        description: ''
        required: true
        schema:
          type: integer
          format: int32
      - name: Account
        in: query
        description: Account
        schema:
          title: Account
          type: int
      requestBody:
        description: ''
        content:
          application/json-patch+json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/BulkDeleteWMSLocationsRequest'
          application/json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/BulkDeleteWMSLocationsRequest'
          text/json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/BulkDeleteWMSLocationsRequest'
          application/*+json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/BulkDeleteWMSLocationsRequest'
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
      operationId: postV1WMSLocationsByLocationIdAddressesDelete
      x-operation-id-source: derived
  /v1/WMSLocations/validate:
    get:
      tags:
      - WMSLocations
      summary: Validates whether a single WMS location ID exists for a given location
      parameters:
      - name: locationId
        in: query
        schema:
          type: integer
          format: int32
      - name: wmsLocationId
        in: query
        schema:
          type: string
      - name: Account
        in: query
        description: Account
        schema:
          title: Account
          type: int
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: boolean
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
      operationId: getV1WMSLocationsValidate
      x-operation-id-source: derived
    post:
      tags:
      - WMSLocations
      summary: Validates multiple WMS location IDs for a given location.
      parameters:
      - name: Account
        in: query
        description: Account
        schema:
          title: Account
          type: int
      requestBody:
        content:
          application/json-patch+json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/ValidateWmsLocationIdsRequest'
          application/json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/ValidateWmsLocationIdsRequest'
          text/json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/ValidateWmsLocationIdsRequest'
          application/*+json; x-api-version=1.0:
            schema:
              $ref: '#/components/schemas/ValidateWmsLocationIdsRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - OAuth2:
        - io.common
      operationId: postV1WMSLocationsValidate
      x-operation-id-source: derived
components:
  schemas:
    BinItem:
      type: object
      properties:
        barcode:
          type:
          - string
          - 'null'
        weight:
          type: number
          format: double
        unit:
          type:
          - string
          - 'null'
        weightType:
          $ref: '#/components/schemas/WeightType'
        quantity:
          type: number
          format: double
        itemCode:
          type:
          - string
          - 'null'
        itemName:
          type:
          - string
          - 'null'
        isWeightAdjusted:
          type: boolean
      additionalProperties: false
    WMSAreaType:
      enum:
      - 0
      - 1
      - 2
      type: integer
      format: int32
    WeightType:
      enum:
      - 0
      - 1
      type: integer
      format: int32
    CreateAreaWMSLocationRequest:
      type: object
      properties:
        wmsLocationId:
          type:
          - string
          - 'null'
        areaId:
          type:
          - integer
          - 'null'
          format: int32
        rack:
          type:
          - integer
          - 'null'
          format: int32
        shelf:
          type:
          - integer
          - 'null'
          format: int32
        bin:
          type:
          - integer
          - 'null'
          format: int32
      additionalProperties: false
    BulkDeleteWMSLocationsRequest:
      type: object
      properties:
        locationId:
          type: integer
          format: int32
        areaId:
          type:
          - integer
          - 'null'
          format: int32
        wmsLocationIds:
          type:
          - array
          - 'null'
          items:
            type: integer
            format: int32
      additionalProperties: false
    Int32ResourceCreatedResponse:
      type: object
      properties:
        id:
          type: integer
          format: int32
      additionalProperties: false
    Shelf:
      type: object
      properties:
        index:
          type: integer
          format: int32
        bins:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Bin'
        code:
          type:
          - string
          - 'null'
        slot:
          type: integer
          format: int32
      additionalProperties: false
    UpdateWMSAreaRequest:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
        type:
          $ref: '#/components/schemas/WMSAreaType'
        properties:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
      additionalProperties: false
    GenerateWMSLocationsRequest:
      type: object
      properties:
        areaId:
          type:
          - integer
          - 'null'
          format: int32
        rackCount:
          type:
          - integer
          - 'null'
          format: int32
        shelfCount:
          type:
          - integer
          - 'null'
          format: int32
        binCount:
          type:
          - integer
          - 'null'
          format: int32
        addressFormat:
          type:
          - string
          - 'null'
        includeAllAreas:
          type:
          - boolean
          - 'null'
      additionalProperties: false
    AttachWmsLocationToCabinetRequest:
      type: object
      properties:
        areaId:
          type: integer
          format: int32
        deviceId:
          type: string
          format: uuid
      additionalProperties: false
    Compartment:
      type: object
      properties:
        index:
          type: integer
          format: int32
        shelves:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Shelf'
        bins:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ShelfBinValueTuple'
          readOnly: true
      additionalProperties: false
    ShelfBinValueTuple:
      type: object
      additionalProperties: false
    Error:
      type: object
      properties:
        code:
          type:
          - string
          - 'null'
        message:
          type:
          - string
          - 'null'
      additionalProperties: false
    WMSLocationResponse:
      type: object
      properties:
        id:
          type: integer
          format: int32
        wmsLocationId:
          type:
          - string
          - 'null'
        areaId:
          type:
          - integer
          - 'null'
          format: int32
        wmsAreaId:
          type:
          - string
          - 'null'
        wmsAreaType:
          type:
          - integer
          - 'null'
          format: int32
        rack:
          type:
          - integer
          - 'null'
          format: int32
        shelf:
          type:
          - integer
          - 'null'
          format: int32
        bin:
          type:
          - integer
          - 'null'
          format: int32
      additionalProperties: false
    ApiErrorResponse:
      type: object
      properties:
        errors:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Error'
      additionalProperties: false
    CabinetLocationItemsParam:
      type: object
      properties:
        id:
          type: integer
          format: int32
        barcode:
          type:
          - string
          - 'null'
        weight:
          type:
          - number
          - 'null'
          format: double
        unit:
          type:
          - string
          - 'null'
        weightType:
          $ref: '#/components/schemas/WeightType'
        quantity:
          type: number
          format: double
        itemCode:
          type:
          - string
          - 'null'
        itemName:
          type:
          - string
          - 'null'
        isWeightAdjusted:
          type: boolean
        bufferLevel:
          type:
          - number
          - 'null'
          format: double
        minOrderQty:
          type:
          - number
          - 'null'
          format: double
      additionalProperties: false
    ValidateWmsLocationIdsRequest:
      type: object
      properties:
        locationId:
          type: integer
          format: int32
        wmsLocationIds:
          type:
          - array
          - 'null'
          items:
            type: string
      additionalProperties: false
    CreateWMSAreaRequest:
      type: object
      properties:
        wmsAreaId:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
        type:
          $ref: '#/components/schemas/WMSAreaType'
        compartments:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Compartment'
      additionalProperties: false
    Bin:
      type: object
      properties:
        index:
          type: integer
          format: int32
        code:
          type:
          - string
          - 'null'
        items:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/BinItem'
        itemParam:
          $ref: '#/components/schemas/CabinetLocationItemsParam'
      additionalProperties: false
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://identity.scanbro.com/connect/authorize
          tokenUrl: https://identity.scanbro.com/connect/token
          scopes:
            io.common: default scope
