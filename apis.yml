aid: invendor
name: Invendor
description: >-
  Invendor is a smart industrial vending and vendor-managed inventory (VMI)
  platform for industrial distributors and manufacturers, combining
  weight-sensing (Gravity) and scan-based (Capture) smart cabinets, a Storeroom
  mobile app, and cloud warehouse software to automate tool and consumable
  replenishment across customer locations. Invendor (formerly Scanbro, a
  Techstars company based in Tallinn, Estonia) exposes two public OAS3 REST APIs
  - a Common API for managing accounts, items, locations, operations, orders,
  users, and devices, and a Reporting API for scans, consumption, replenishment,
  and unique-item status data - both secured with OAuth2 (authorization code)
  through the identity.scanbro.com identity server.
url: https://raw.githubusercontent.com/api-evangelist/invendor/refs/heads/main/apis.yml
